<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Wiring diagram: M5StickS3 enclosure monitor</title>
  <rect width="900" height="830" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Wiring diagram (M5StickS3 build)</text>

  <!-- ============ A: Sensor ============ -->
  <text x="40" y="50" font-weight="bold" font-size="15" fill="#111">A. BME680 sensor (I2C)</text>
  <rect x="40" y="62" width="170" height="160" rx="8" fill="#eef2f7" stroke="#334" stroke-width="2"/>
  <text x="125" y="84" text-anchor="middle" font-weight="bold">M5StickS3</text>
  <g text-anchor="end" fill="#111">
    <text x="198" y="116">3V3</text><text x="198" y="146">GND</text>
    <text x="198" y="176">G9 (SDA)</text><text x="198" y="206">G10 (SCL)</text>
  </g>
  <rect x="400" y="62" width="170" height="160" rx="8" fill="#eef7ee" stroke="#343" stroke-width="2"/>
  <text x="485" y="84" text-anchor="middle" font-weight="bold">BME680 breakout</text>
  <g fill="#111">
    <text x="412" y="116">VCC</text><text x="412" y="146">GND</text>
    <text x="412" y="176">SDA</text><text x="412" y="206">SCL</text>
  </g>
  <g stroke-width="3" fill="none">
    <line x1="210" y1="112" x2="400" y2="112" stroke="#d32f2f"/>
    <line x1="210" y1="142" x2="400" y2="142" stroke="#222"/>
    <line x1="210" y1="172" x2="400" y2="172" stroke="#1976d2"/>
    <line x1="210" y1="202" x2="400" y2="202" stroke="#ef6c00"/>
  </g>
  <text x="40" y="246" fill="#444">Most BME680 breakouts already include the I2C pull-up resistors. Power the sensor from 3V3.</text>

  <!-- ============ B: 4-pin fan ============ -->
  <text x="40" y="288" font-weight="bold" font-size="15" fill="#111">B. 4-pin PWM fan (what the firmware is written for: 25 kHz PWM + tach)</text>
  <rect x="40" y="302" width="170" height="130" rx="8" fill="#eef2f7" stroke="#334" stroke-width="2"/>
  <text x="125" y="324" text-anchor="middle" font-weight="bold">M5StickS3</text>
  <g text-anchor="end" fill="#111">
    <text x="198" y="346">G5 (FAN PWM)</text><text x="198" y="376">G6 (TACH)</text><text x="198" y="406">GND</text>
  </g>
  <rect x="400" y="302" width="170" height="150" rx="8" fill="#fff6e8" stroke="#543" stroke-width="2"/>
  <text x="485" y="324" text-anchor="middle" font-weight="bold">4-pin fan</text>
  <g fill="#111">
    <text x="412" y="346">PWM (blue)</text><text x="412" y="376">TACH (green)</text>
    <text x="412" y="406">+12 V (red)</text><text x="412" y="436">GND (black)</text>
  </g>
  <rect x="700" y="372" width="150" height="76" rx="8" fill="#fdecec" stroke="#533" stroke-width="2"/>
  <text x="775" y="390" text-anchor="middle" font-weight="bold">12 V supply</text>
  <text x="712" y="406" fill="#111">+12 V</text><text x="712" y="436" fill="#111">GND</text>
  <g stroke-width="3" fill="none">
    <line x1="210" y1="342" x2="400" y2="342" stroke="#1976d2"/>
    <line x1="210" y1="372" x2="400" y2="372" stroke="#2e7d32"/>
    <line x1="570" y1="402" x2="700" y2="402" stroke="#d32f2f"/>
    <line x1="570" y1="432" x2="700" y2="432" stroke="#222"/>
    <polyline points="210,402 300,402 300,492 640,492 640,432" stroke="#222"/>
  </g>
  <circle cx="640" cy="432" r="4" fill="#222"/>
  <text x="320" y="486" fill="#222" font-size="12">common GND (stick, fan and supply must share ground)</text>
  <text x="40" y="520" fill="#444">The 12 V rail never touches a GPIO. The tach is open-collector: the firmware enables the internal pull-up to 3.3 V.</text>

  <!-- ============ C: MOSFET ============ -->
  <text x="40" y="565" font-weight="bold" font-size="15" fill="#111">C. Alternative for a 2- or 3-wire fan: low-side MOSFET switch</text>
  <rect x="40" y="650" width="170" height="110" rx="8" fill="#eef2f7" stroke="#334" stroke-width="2"/>
  <text x="125" y="672" text-anchor="middle" font-weight="bold">M5StickS3</text>
  <g text-anchor="end" fill="#111">
    <text x="198" y="690">G5 (FAN PWM)</text><text x="198" y="730">GND</text>
  </g>
  <!-- rails -->
  <line x1="505" y1="590" x2="800" y2="590" stroke="#d32f2f" stroke-width="3"/>
  <text x="808" y="594" fill="#d32f2f" font-weight="bold">+12 V</text>
  <line x1="260" y1="760" x2="800" y2="760" stroke="#222" stroke-width="3"/>
  <text x="808" y="764" fill="#222" font-weight="bold">GND</text>
  <!-- fan -->
  <line x1="505" y1="590" x2="505" y2="605" stroke="#d32f2f" stroke-width="3"/>
  <rect x="455" y="605" width="100" height="40" rx="8" fill="#fff6e8" stroke="#543" stroke-width="2"/>
  <text x="505" y="630" text-anchor="middle" fill="#111">Fan (+12 V)</text>
  <line x1="505" y1="645" x2="505" y2="668" stroke="#222" stroke-width="3"/>
  <!-- mosfet -->
  <rect x="430" y="668" width="150" height="72" rx="8" fill="#f3eefc" stroke="#435" stroke-width="2"/>
  <text x="505" y="696" text-anchor="middle" font-weight="bold">N-MOSFET</text>
  <text x="505" y="714" text-anchor="middle" font-size="11" fill="#444">logic-level, e.g. IRLZ44N</text>
  <text x="514" y="654" font-size="11" fill="#444">D</text>
  <text x="436" y="680" font-size="11" fill="#444">G</text>
  <text x="508" y="754" font-size="11" fill="#444">S</text>
  <line x1="505" y1="740" x2="505" y2="760" stroke="#222" stroke-width="3"/>
  <circle cx="505" cy="760" r="4" fill="#222"/>
  <!-- gate path -->
  <line x1="210" y1="686" x2="260" y2="686" stroke="#1976d2" stroke-width="3"/>
  <rect x="260" y="674" width="70" height="24" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="295" y="691" text-anchor="middle" font-size="12">100 &#937;</text>
  <line x1="330" y1="686" x2="430" y2="686" stroke="#1976d2" stroke-width="3"/>
  <circle cx="390" cy="686" r="4" fill="#1976d2"/>
  <!-- gate pulldown -->
  <line x1="390" y1="686" x2="390" y2="700" stroke="#1976d2" stroke-width="3"/>
  <rect x="378" y="700" width="24" height="42" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <text x="370" y="725" text-anchor="end" font-size="12">10 k&#937; pulldown</text>
  <line x1="390" y1="742" x2="390" y2="760" stroke="#222" stroke-width="3"/>
  <circle cx="390" cy="760" r="4" fill="#222"/>
  <!-- stick GND -->
  <polyline points="210,726 260,726 260,760" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="260" cy="760" r="4" fill="#222"/>
  <!-- flyback diode (anode at drain, cathode at +12 V) -->
  <line x1="640" y1="590" x2="640" y2="612" stroke="#d32f2f" stroke-width="3"/>
  <circle cx="640" cy="590" r="4" fill="#d32f2f"/>
  <line x1="628" y1="612" x2="652" y2="612" stroke="#111" stroke-width="3"/>
  <polygon points="640,612 628,636 652,636" fill="#fff" stroke="#111" stroke-width="2"/>
  <polyline points="640,636 640,657 505,657" fill="none" stroke="#222" stroke-width="3"/>
  <circle cx="505" cy="657" r="4" fill="#222"/>
  <text x="662" y="628" font-size="12" fill="#111">flyback diode</text>
  <text x="662" y="644" font-size="11" fill="#444">1N4007 / SS14, across the fan</text>
  <text x="40" y="800" fill="#444">3-wire fan tach: connect it to G6 with a 10 k&#937; pull-up to 3V3. Do not feed 12 V into G6.</text>
  <text x="40" y="818" fill="#444">The MOSFET switches the fan at 25 kHz; the firmware's PWM code works unchanged.</text>
</svg>
